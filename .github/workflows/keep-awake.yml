name: Keep Scribist awake

# Render's free plan sleeps after 15 idle minutes, and the first visit after
# that waits up to a minute for it to wake. Pinging every 10 minutes keeps it
# ready during the day.
#
# Not all day: the free plan's 750 instance hours a month are shared with the
# Tommy Games server, which is kept awake 7 hours every evening (about 225
# hours a month). 15 hours a day here is about 465, leaving room for visits
# outside the window.
#
# The hours are UTC: 14:00-05:00 UTC is 8 am to 11 pm in Calgary in summer
# (UTC-6) and 7 am to 10 pm in winter (UTC-7). GitHub may start scheduled runs
# a few minutes late, and turns them off after 60 days without a commit.
on:
  schedule:
    - cron: "*/10 14-23,0-4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 https://scribist.onrender.com/api/health
